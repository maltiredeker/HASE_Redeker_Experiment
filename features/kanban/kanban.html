<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kanban</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="./kanban.css">
</head>

<body>
    <div class="page">
        <div class="top">
            <h1>Kanban board</h1>
            <div class="row"><button id="addCol">Add column</button><button class="primary" id="addTask">New
                    task</button></div>
        </div>
        <div class="board" id="board"></div>

        <dialog id="dlg">
            <form method="dialog" id="form">
                <h2 style="margin:0">New task</h2>
                <label>Title</label><input id="t" required>
                <label>Description</label><textarea id="d" rows="3"></textarea>
                <div class="row">
                    <div style="flex:1"><label>Priority</label><select id="p">
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                        </select></div>
                    <div style="flex:1"><label>Due date</label><input type="date" id="due"></div>
                </div>
                <label>Column</label><select id="c"></select>
                <div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button"
                        id="cancel">Cancel</button><button class="primary">Create task</button></div>
            </form>
        </dialog>

        <script src="kanban.js"></script>
    </div>
</body>

</html>
