<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Schedule Planner</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="planner.css">
</head>

<body>
    <div class="page">
        <h1>Schedule planner</h1>
        <div id="msg" role="status"></div>
        <div class="layout">
            <aside><b>Courses</b>
                <div id="list"></div>
                <form id="cf"><label>Course name</label><input id="n" required>
                    <label>Room / location</label><input id="r">
                    <div class="row">
                        <div style="flex:1"><label>Color</label><input type="color" id="col" value="#2b78b8"
                                style="padding:2px;height:34px"></div>
                        <div style="flex:1"><label>Length</label><select id="len">
                                <option value="2">1 hour</option>
                                <option value="3">1.5 hours</option>
                                <option value="4">2 hours</option>
                                <option value="1">30 min</option>
                            </select></div>
                    </div>
                    <button class="primary" style="margin-top:12px;width:100%">Add course</button>
                </form>
                <p class="hint">Drag a course onto the grid, or click a cell to pick one. Click a placed block to remove
                    it.</p>
            </aside>
            <div class="grid" id="grid"></div>
        </div>

        <dialog id="dlg">
            <h2 style="margin:0 0 8px">Assign course</h2>
            <div id="pick"></div>
            <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="cancel">Cancel</button></div>
        </dialog>

        <script src="planner.js"></script>
    </div>
</body>

</html>
