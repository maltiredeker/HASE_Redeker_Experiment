<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="pomodoro.css">
</head>

<body>
    <div class="page">
        <div class="wrap">
            <h1>Pomodoro timer</h1>
            <div class="modes" id="modes"></div>
            <div class="ring"><svg width="260" height="260" viewBox="0 0 260 260">
                    <circle id="bg" cx="130" cy="130" r="118" />
                    <circle id="fg" cx="130" cy="130" r="118" />
                </svg>
                <div id="time"><span id="clock">25:00</span><small id="label">Work</small></div>
            </div>
            <div class="ctl"><button class="primary" id="start">Start</button><button id="pause">Pause</button><button
                    id="reset">Reset</button></div>
            <div class="stat">Focus sessions completed: <b id="count">0</b></div>
            <div class="set">
                <div class="row">
                    <div><label>Work (min)</label><input type="number" min="1" max="120" id="s-work" value="25"></div>
                    <div><label>Short break</label><input type="number" min="1" max="60" id="s-short" value="5"></div>
                    <div><label>Long break</label><input type="number" min="1" max="60" id="s-long" value="15"></div>
                </div>
                <label style="margin-top:12px"><input type="checkbox" id="chime" checked style="width:auto"> Show a
                    popup when time is up</label>
            </div>
        </div>
        <dialog id="alert">
            <h2 id="alert-title" style="margin:0 0 8px"></h2>
            <p id="alert-text" style="margin:0 0 16px"></p>
            <div class="row" style="justify-content:flex-end"><button class="primary" id="alert-ok">OK</button></div>
        </dialog>
        <script src="pomodoro.js"></script>
    </div>
</body>

</html>
